    #   - DB_HOST_SQL=${DB_HOST_SQL:-postgres}
    #   - DB_HOST_NOSQL=${DB_HOST_NOSQL:-mongodb}
    #   - DB_NAME=${DB_NAME:-workdb}
    #   - DB_PASSWORD=${DB_PASSWORD:-root}